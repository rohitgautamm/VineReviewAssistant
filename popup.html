<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VinePilot AI</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .title {
      font-weight: 800;
      font-size: 15px;
      margin: 0;
    }
    .sub {
      font-size: 11px;
      color: #94a3b8;
      margin: 2px 0 0 0;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #151e32;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #1e2942;
      border-color: rgba(99, 102, 241, 0.5);
    }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      border-color: #6366f1;
    }
    .btn-primary:hover {
      filter: brightness(1.08);
    }
    .btn-phone {
      background: linear-gradient(135deg, #059669, #10b981);
      border-color: #10b981;
    }
    .active-asin {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      font-size: 11.5px;
      color: #c7d2fe;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✨</div>
    <div>
      <h1 class="title">VinePilot AI Studio</h1>
      <p class="sub">Human Voice · 100% Guideline Safe · Phone Upload</p>
    </div>
  </div>

  <div id="detected-product" class="active-asin"></div>

  <button type="button" id="open-studio-btn" class="btn btn-primary">
    <span>🚀</span>
    <span>Open AI Review Studio</span>
  </button>

  <button type="button" id="open-sidepanel-btn" class="btn">
    <span>📐</span>
    <span>Open Docked Side Panel</span>
  </button>

  <button type="button" id="open-phone-bridge-btn" class="btn btn-phone">
    <span>📱</span>
    <span>Direct Phone Photo QR Upload</span>
  </button>

  <button type="button" id="open-vine-reviews-btn" class="btn">
    <span>📦</span>
    <span>Go to Amazon Vine Reviews</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
